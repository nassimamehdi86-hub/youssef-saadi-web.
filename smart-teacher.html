function buildCorrectionSheet(ex, result){
  const area = document.getElementById('printArea');
  const ltr = dirAttr(ex.subject);
  const L = examLabels(ex.subject);
  const byNumber = {};
  (ex.questions||[]).forEach(q=>{ byNumber[q.number] = q; });
  const qHtml = (result.perQuestion||[]).map(r=>{
    const q = byNumber[r.number] || {};
    const ratio = r.max ? r.awarded/r.max : 0;
    const mark = ratio>=0.99 ? '✓' : ratio<=0.01 ? '✗' : '~';
    return `
    <div class="sheet-q">
      <div class="sheet-qlabel"${ltr}>${L.question} ${r.number} — ${mark} ${r.awarded}/${r.max}</div>
      <div class="sheet-qtext"${ltr}>${esc(q.text||'')}</div>
      <div style="font-size:13px;margin:4px 0;"><b>إجابتك (مفرَّغة رقميًا):</b> ${esc(r.studentAnswerSummary||'—')}</div>
      ${q.modelAnswer ? `<div style="font-size:13px;margin:4px 0;color:#22352B;font-weight:700;"${ltr}><b>الإجابة الصحيحة:</b> ${esc(q.modelAnswer)}</div>` : ''}
      ${r.feedback ? `<div style="font-size:12.5px;color:#5a5170;"><b>الملاحظة:</b> ${esc(r.feedback)}</div>` : ''}
    </div>`;
  }).join('');
  area.innerHTML = `
    <div class="sheet">
      ${sheetWatermarkHTML()}
      ${sheetHeaderBrandHTML()}
      <div class="sheet-head">
        <div>
          <div class="sheet-title">تصحيح: ${esc(ex.title)}</div>
          <div class="sheet-meta">${ex.level?esc(ex.level)+' — ':''}${esc(ex.subject)} — النتيجة: ${result.score} / ${result.totalPoints}</div>
        </div>
        <div class="sheet-meta">الاسم: ${esc(result.studentName)}</div>
      </div>
      ${result.overallFeedback ? `<p style="font-size:13px;margin-bottom:14px;">${esc(result.overallFeedback)}</p>` : ''}
      ${qHtml}
      ${sheetFooterBrandHTML()}
    </div>
  `;
}

/* ============================= STUDENT: RESULT ============================= */
function renderStudentResult(){
  const {result, examData} = state;
  const pct = examData.totalPoints? (result.score/examData.totalPoints*100):0;
  app.innerHTML = `
    ${Header('نتيجتك')}
    <div class="card center">
      <div class="muted">${esc(result.studentName)}</div>
      <div class="score-big" dir="ltr">${result.score} / ${result.totalPoints}</div>
      <div class="pill">${pct.toFixed(0)}%</div>
      ${result.overallFeedback?`<p class="muted" style="margin-top:14px;">${esc(result.overallFeedback)}</p>`:''}
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="openCorrection">👁️ فتح PDF</button>
        <button class="btn btn-gold" id="downloadCorrection">⬇️ تنزيل PDF</button>
      </div>
    </div>
    <div class="card">
      <h3>تفاصيل التصحيح</h3>
      ${result.perQuestion.map(q=> qaBlockHTML(q, examData)).join('')}
    </div>
    <a class="backlink" href="${location.pathname}">⟵ الرئيسية</a>
  `;
  wireCorrectionPdfButtons('openCorrection', 'downloadCorrection', examData, result);
}

/* ============================= RENDER ROUTER ============================= */
function render(){
  document.getElementById('printArea').innerHTML='';
  if(state.screen!=='studentExam' && unsubExamListener){ unsubExamListener(); unsubExamListener=null; }
  switch(state.screen){
    case 'landing': renderLanding(); break;
    case 'teacherGate': renderTeacherGate(); break;
    case 'setup': renderSetup(); break;
    case 'teacherDashboard': renderTeacherDashboard(); break;
    case 'teacherCreate': renderTeacherCreate(); break;
    case 'teacherExamView': renderTeacherExamView(); break;
    case 'teacherStudentResult': renderTeacherStudentResult(); break;
    case 'studentExam': renderStudentExam(); break;
    case 'studentResult': renderStudentResult(); break;
    default: renderLanding();
  }
}

/* ============================= PWA / SERVICE WORKER (تحديث تلقائي) ============================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{ /* نفس Service Worker العام للمنصة */
      // كل ما فتحنا الصفحة، نفحصو يدويًا واش كاين تحديث جديد (بجانب الفحص التلقائي للمتصفح)
      reg.update().catch(()=>{});
      // نفحصو دوريًا (كل 60 ثانية) طالما الصفحة مفتوحة، باش التحديث يوصل بسرعة بلا حاجة التلميذ يسكر التطبيق
      setInterval(()=>{ reg.update().catch(()=>{}); }, 60000);
    }).catch(()=>{});
  });
  // كي يفعّل Service Worker جديد (نسخة محدثة)، نعاودو تحميل الصفحة تلقائيًا مرة وحدة باش يبان آخر تحديث فورًا
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}

/* ============================= PWA / زر تثبيت التطبيق ============================= */
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  document.querySelectorAll('.install-app-btn').forEach(b=> b.style.display = 'inline-flex');
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  document.querySelectorAll('.install-app-btn').forEach(b=> b.style.display = 'none');
  toast('تم تثبيت التطبيق ✅');
});
async function triggerInstallPrompt(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.querySelectorAll('.install-app-btn').forEach(b=> b.style.display = 'none');
}
// يبني زر التثبيت، ويبقى مخفيًا تلقائيًا إلا كان التطبيق مثبت أصلاً أو المتصفح ما كيدعمش الميزة
function installButtonHTML(){
  if(isStandalone) return '';
  return `<button class="btn btn-gold install-app-btn" id="installAppBtn" style="display:none;">📲 تثبيت التطبيق</button>`;
}
function wireInstallButton(id){
  const btn = document.getElementById(id);
  if(!btn) return;
  if(deferredInstallPrompt) btn.style.display = 'inline-flex';
  btn.onclick = triggerInstallPrompt;
}

(function boot(){
  tryImportCfgFromUrl();
  if(state.examId){
    if(initFirebase()){ go('studentExam', {examId: state.examId}); }
    else {
      app.innerHTML = `${Header()}<div class="card">
        <p class="muted">هذا الرابط غير مكتمل من الناحية التقنية. يرجى التأكد من فتح الرابط الكامل الذي أرسله الأستاذ(ة)، وليس رمزًا مقتطعًا منه.</p>
        <button class="btn btn-primary" id="tryManual">العودة إلى قائمة الاختبارات</button>
      </div>`;
      document.getElementById('tryManual').onclick = ()=> go('landing');
    }
  } else {
    render();
  }
})();
